:root{--bg:#06111f;--panel:#0c1c30;--panel2:#102740;--line:#244563;--txt:#f4f8fc;--muted:#9fb3c8;--a:#55d6b2;--b:#55a9ff;--gold:#f3c45b;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#122b46 0,#06111f 40%,#050d18 100%);color:var(--txt);font-family:Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#76caff;text-decoration:none}
.app{display:flex;min-height:100vh}aside{width:270px;background:#071321;border-left:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:19px;margin-bottom:16px}.brand img{width:76px;height:58px;object-fit:contain}.small{font-size:12px}.muted{color:var(--muted)}
nav{display:grid;gap:7px}nav button{background:#0d2137;color:#b9c9da;border:1px solid #24435f;border-radius:11px;padding:11px;text-align:right}nav button.active,nav button:hover{background:#173b5b;color:#fff;border-color:#5b87a9}
main{flex:1;max-width:1500px;margin:auto;width:100%;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1,h2,h3{margin:0 0 8px}
.btn{border:1px solid var(--line);background:#143250;color:#fff;border-radius:10px;padding:10px 13px}.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#06131f;font-weight:900;border:0}.danger{background:#4a2027}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(145deg,#0d2137,#0a1829);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 30px #0003}.stat{font-size:28px;font-weight:900;margin-top:6px}.view{display:none}.view.active{display:block}
.notice{padding:12px;border:1px dashed #3c617d;border-radius:11px;background:#0a1e31;color:#c8d7e5}.list{display:grid;gap:10px}.item{background:#081a2c;border:1px solid #24435f;border-radius:13px;padding:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;background:#173957;color:#b9d7ee;padding:4px 7px;border-radius:7px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.platform{border-right:4px solid var(--a)}.copybox{white-space:pre-wrap;background:#061421;border:1px solid #203e59;padding:11px;border-radius:10px;line-height:1.8;margin-top:9px}
.designPreview{min-height:250px;border-radius:15px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#0a1220,#1c2c42);position:relative;overflow:hidden}.designPreview:after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(120deg,transparent 45%,#f3c45b18 46%,transparent 55%);transform:rotate(8deg)}.designPreview>*{position:relative;z-index:1}.designLogo{height:35px;width:75px;object-fit:contain;align-self:flex-start}.bigmatch{font-size:27px;font-weight:900;line-height:1.35}.yellow{color:var(--gold)}.format{display:inline-block;background:#173a57;border-radius:7px;padding:4px 7px;font-size:11px}
.checklist label{display:block;padding:10px;border-bottom:1px solid #1d3850}input[type=checkbox]{transform:scale(1.2);margin-left:8px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #213e58;text-align:right}th{color:#a9bfd2}.kpi{font-size:12px;color:#a9bfd2}.success{color:#66e2b8}
.toast{position:fixed;left:18px;bottom:18px;background:#12324d;border:1px solid #4b7899;padding:12px 15px;border-radius:10px;display:none;z-index:50}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.three,.four{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{display:block}aside{width:auto;height:auto;position:static}nav{grid-template-columns:1fr 1fr}main{padding:12px}header{flex-direction:column;align-items:stretch}.stats,.two,.three,.four{grid-template-columns:1fr}}
</style></head>

function go(k){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('v-'+k).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.k===k));document.getElementById('title').textContent=nav.find(x=>x[0]===k)[1].replace(/^\S+\s/,'');render(k)}
document.getElementById('nav').innerHTML=nav.map(x=>`<button data-k="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
document.getElementById('views').innerHTML=nav.map(x=>`<section id="v-${x[0]}" class="view"></section>`).join('');

{type:'خبر اليوم الرئيسي',title:'رونالدو يبدأ الموسم بهدف… والنصر يحافظ على بدايته المثالية',hook:'رونالدو دخل الموسم من الباب الكبير! 🔥',cta:'وش تتوقع للنصر هذا الموسم؟',body:'ذكرت رويترز أن كريستيانو رونالدو سجل هدفه الأول هذا الموسم مع النصر في الفوز 4-0 على الرياض، بينما حقق الهلال والأهلي والاتفاق انتصاراتهم الثانية.',url:sources.reuters},
{type:'مباراة اليوم + التوقع',title:'الاتحاد × الحزم — 21:00',hook:'الاتحاد الليلة… هل يحسمها؟',cta:'شارك توقعك قبل صافرة البداية.',body:'الجولة الثالثة من دوري روشن. الموعد 21:00 بتوقيت السعودية. التوقع التحريري لـLeague Hunters: الاتحاد أقرب للفوز، والنتيجة المقترحة 2-1. هذا توقع تحريري وليس نتيجة مؤكدة.',url:sources.saff},

'Facebook':`🔥 ${p.title}\n\n${p.body}\n\n${p.cta}\n\n#LeagueHunters #كرة_القدم`,
'WhatsApp':`${p.hook}\n\n${p.body}\n\n${p.cta}`,
'YouTube':`${p.title} | League Hunters\n\n${p.body}\n\n${p.cta}\n#LeagueHunters`
}}

{title:'رونالدو يسجل هدفه الأول هذا الموسم والنصر يهزم الرياض 4-0',source:'Reuters',url:sources.reuters},
{title:'Chelsea vs Fulham — ختام الجولة الأولى من الدوري الإنجليزي',source:'Premier League',url:sources.pl},

{title:'مواعيد الجولة الثالثة من دوري روشن اليوم',source:'الاتحاد السعودي لكرة القدم / SPL',url:sources.saff}
];db.designs=db.posts.map((p,i)=>({title:p.title,format:['9:16','1:1','16:9'][i%3],headline:p.hook,prompt:`تصميم League Hunters احترافي لمحتوى: ${p.title}. استخدم الشعار الرسمي المرفق كما هو دون تغيير أو توليد شعار بديل. نص قليل جداً، هوية رياضية فاخرة، تباين قوي، مساحة واضحة للعناوين، وقياس ${['9:16','1:1','16:9'][i%3]}.`}));db.ready=true;db.date=TODAY;save();renderAll();go('daily');toast('تم تجهيز حزمة اليوم بالكامل')}
function clearToday(){db={ready:false,posts:[],matches:[],news:[],designs:[]};save();renderAll();go('home');toast('تم مسح الحزمة')}
function card(p){let text=`${p.title}\n\n${p.body}\n\nHook: ${p.hook}\nCTA: ${p.cta}`;return `<div class="item"><div class="head"><b>${esc(p.title)}</b><span class="tag">${esc(p.type)}</span></div><div class="copybox">${esc(p.body)}</div><div class="actions"><button class="btn primary" onclick='copy(${JSON.stringify(text)})'>نسخ القطعة</button>${p.url?`<a class="btn" href="${p.url}" target="_blank">فتح المصدر</a>`:''}<span class="tag">الشعار الرسمي مدمج</span></div></div>`}
function home(){return `<div class="grid stats"><div class="card">المحتوى<div class="stat">${db.posts.length}</div></div><div class="card">المباريات<div class="stat">${db.matches.length}</div></div><div class="card">الأخبار<div class="stat">${db.news.length}</div></div><div class="card">التصاميم<div class="stat">${db.designs.length}</div></div><div class="card">المصادر<div class="stat">${[...new Set([...db.news.map(x=>x.url),...db.matches.map(x=>x.url)])].filter(Boolean).length}</div></div><div class="card">الحالة<div class="stat success">${db.ready?'جاهز':'—'}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h2>🔥 تشغيل اليوم</h2><div class="notice">${db.ready?'الحزمة جاهزة للنسخ والنشر.':'اضغط «جهّز محتوى اليوم» مرة واحدة.'}</div><div class="actions"><button class="btn primary" onclick="prepareToday()">🔥 جهّز محتوى اليوم</button></div></div><div class="card"><h2>⚙️ الثوابت</h2><div class="list"><div class="item">الشعار الرسمي مدمج داخل الملف ويظهر في بطاقات المحتوى والتصميم.</div><div class="item">لا نستخدم ادعاءات غير موثقة عن مزايا التطبيق.</div><div class="item">كل الأوقات المعروضة بتوقيت السعودية.</div></div></div></div>`}
function daily(){return `<div class="card"><h2>🧠 حزمة اليوم — ${TODAY}</h2><div class="notice">هذه هي الحزمة التنفيذية: جدول + خبر + مباراة اليوم + فيديو + تذكير + نتيجة + ما بعد المباراة + تسويق التطبيق والقناة.</div><div class="list" style="margin-top:12px">${db.posts.length?db.posts.map(card).join(''):'<div class="muted">لم تُجهّز الحزمة بعد.</div>'}</div></div>`}
function matches(){return `<div class="card"><h2>⚽ مباريات اليوم</h2><table><thead><tr><th>الدوري</th><th>المباراة</th><th>الوقت</th><th>الأولوية</th><th>المصدر</th></tr></thead><tbody>${db.matches.map(m=>`<tr><td>${m.league}</td><td><b>${m.a} × ${m.b}</b></td><td>${m.time}</td><td>${m.priority}</td><td><a href="${m.url}" target="_blank">فتح</a></td></tr>`).join('')||'<tr><td colspan="5">اضغط جهّز محتوى اليوم.</td></tr>'}</tbody></table></div>`}

function design(){return `<div class="grid three">${db.designs.map(d=>`<div class="card"><div class="designPreview"><img class="designLogo" src="${LOGO}"><span class="format">${d.format}</span><div class="bigmatch">${esc(d.title)}</div><div class="yellow">${esc(d.headline)}</div><div class="small">League Hunters</div></div><div class="copybox">${esc(d.prompt)}</div><div class="actions"><button class="btn primary" onclick='downloadDesign(${JSON.stringify(d)})'>تنزيل تصميم PNG</button><button class="btn" onclick='copy(${JSON.stringify(d.prompt)})'>نسخ Prompt</button></div></div>`).join('')||'<div class="notice">جهّز محتوى اليوم أولاً.</div>'}</div>`}
function downloadDesign(d){const c=document.createElement('canvas');const [w,h]=d.format==='9:16'?[1080,1920]:d.format==='1:1'?[1080,1080]:[1920,1080];c.width=w;c.height=h;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#081321');g.addColorStop(1,'#183b5a');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='#f3c45b';x.lineWidth=Math.max(6,w/220);x.strokeRect(30,30,w-60,h-60);const im=new Image();im.onload=()=>{x.drawImage(im,60,60,Math.min(w*0.24,260),Math.min(w*0.18,190));x.fillStyle='#fff';x.font=`900 ${Math.round(w/18)}px Tahoma`;x.textAlign='right';wrap(x,d.title,w-70,h*.43,w*.82,Math.round(w/22));x.fillStyle='#f3c45b';x.font=`700 ${Math.round(w/28)}px Tahoma`;wrap(x,d.headline,w-70,h*.68,w*.8,Math.round(w/34));x.fillStyle='#9fb3c8';x.font=`500 ${Math.round(w/40)}px Tahoma`;x.fillText('League Hunters',w-70,h-100);const a=document.createElement('a');a.download='LH-'+d.title.replace(/[^\u0600-\u06FFa-zA-Z0-9]+/g,'-')+'.png';a.href=c.toDataURL('image/png');a.click()};im.src=LOGO}
function wrap(c,t,x,y,maxWidth,lh){let words=t.split(' '),line='';for(let n=0;n<words.length;n++){let test=line+words[n]+' ';if(c.measureText(test).width>maxWidth&&n>0){c.fillText(line,x,y);line=words[n]+' ';y+=lh}else line=test}c.fillText(line,x,y)}

function marketing(){return `<div class="grid two"><div class="card"><h2>📣 تسويق التطبيق</h2>${[['Hook','مو بس تشاهد… شارك وتنافس. ⚽'],['رسالة قصيرة','League Hunters يحول متابعتك لكرة القدم إلى تجربة يومية فيها مباريات وتوقعات واختبارات وتحديات ومستويات وبطولات ومنافسة. جرّبه مجاناً.'],['CTA','حمّل التطبيق وابدأ تجربتك اليوم.'],['رسالة للقروبات','يا جماعة، جرّبوا League Hunters مجاناً. الفكرة مو بس متابعة المباريات؛ فيها تفاعل وتوقعات واختبارات وتحديات ومنافسة، ومناسبة للكبار والصغار.']].map(x=>`<div class="item"><b>${x[0]}</b><div class="copybox">${x[1]}</div><button class="btn" onclick='copy(${JSON.stringify(x[1])})'>نسخ</button></div>`).join('')}</div><div class="card"><h2>📲 قناة WhatsApp</h2><div class="notice">الرابط الثابت:</div><div class="copybox">${WA}</div><button class="btn primary" onclick='copy(WA)'>نسخ رابط القناة</button><p class="muted">التجهيز التسويقي يعتمد على مزايا التطبيق الموثقة في مواد League Hunters، مع تجنب أي ادعاء غير مؤكد.</p></div></div>`}
function performance(){return `<div class="grid four"><div class="card">المشاهدات<div class="stat">—</div><div class="kpi">أدخل الأرقام بعد النشر</div></div><div class="card">التفاعل<div class="stat">—</div><div class="kpi">لا نخترع بيانات</div></div><div class="card">المتابعون<div class="stat">—</div><div class="kpi">من Insights</div></div><div class="card">أفضل Hook<div class="stat">—</div><div class="kpi">يُحدد من النتائج</div></div></div><div class="card" style="margin-top:14px"><h2>قاعدة القرار</h2><p class="muted">لا نقرر نجاح المحتوى من الانطباع فقط. بعد النشر نراجع المشاهدة، الاحتفاظ، المشاركة، الحفظ، المتابعة، ثم نكرر ما أثبت نفسه.</p></div>`}
function qa(){return `<div class="card"><h2>🛡️ فحص قبل النشر</h2><div class="checklist">${['المصدر موجود ومفتوح','الموعد بتوقيت السعودية صحيح','أسماء الفرق صحيحة','التوقع واضح بأنه توقع وليس نتيجة مؤكدة','Hook قوي وقصير','النص مناسب للمنصة','الرابط صحيح','الشعار الرسمي مستخدم كما هو','لا توجد ميزة تطبيق غير موثقة','لا توجد هاشتاقات زائدة','لا يوجد تكرار غير مبرر','التصميم بالمقاس الصحيح'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></div>`}
function identity(){return `<div class="grid two"><div class="card"><h2>⚙️ الهوية</h2><img src="${LOGO}" style="width:180px;height:130px;object-fit:contain;background:#07111f;border-radius:12px"><div class="notice">هذا هو الشعار المدمج في المنصة. لا يتم استبداله ولا توليد شعار بديل.</div></div><div class="card"><h2>قواعد ثابتة</h2><div class="list">${['لغة سعودية طبيعية عند الحاجة','كلام قليل على التصميم','هوية رياضية فاخرة','كل منصة لها معالجة مستقلة','عدم استخدام «الصيادين» أو مشتقاتها','لا نعد المستخدم بميزة غير موثقة','التوقع رأي تحريري وليس ضماناً','الأوقات بتوقيت السعودية'].map(x=>`<div class="item">✓ ${x}</div>`).join('')}</div></div></div>`}
function render(k){const f={home,daily,matches,news,platforms,design,video,calendar,library,marketing,performance,qa,identity};document.getElementById('v-'+k).innerHTML=f[k]()}
function renderAll(){nav.forEach(x=>render(x[0]))}
renderAll();go('home');
</script></body></html>
